name: Tests

on:
  # Manual and PR only, so iterating on data and copy doesn't fire a red
  # notification on every push. Switch push back on once the shape settles.
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
